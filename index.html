<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>BACKYARD TALES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+DW+Pica+SC&family=IM+Fell+English:ital@0;1&family=EB+Garamond:ital,wght@0,400..600;1,400..600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.162.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.162.0/examples/jsm/"
}}
</script>
<style>
/* ─── RESET + TYPOGRAPHY ──────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

:root{
  --bg:        #14160e;   /* forest-floor black */
  --bg2:       #1a1d12;
  --panel:     #1f2218;   /* aged page */
  --panel2:    #262a1d;
  --panel3:    #2f331f;
  --border:    #4a4530;   /* faded gilt */
  --borderH:   #756a3f;
  --ink:       #c8b890;   /* parchment text */
  --inkH:      #e8d8a8;   /* bright parchment */
  --dim:       #6f6644;
  --moss:      #6a8a3a;
  --moss2:     #4a6a28;
  --rust:      #a83828;   /* mushroom red */
  --gold:      #c8a850;
  --bone:      #d8c8a0;

  --fHead:'IM Fell DW Pica SC', serif;
  --fSer: 'IM Fell English', 'EB Garamond', serif;
  --fBody:'EB Garamond', Georgia, serif;
}

html,body{
  width:100%;height:100%;background:var(--bg);color:var(--ink);
  font-family:var(--fBody);font-size:16px;line-height:1.45;
  overflow:hidden;
}

/* paper grain on everything */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:9998;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(200,168,80,0.05), transparent 65%),
    repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.08) 2px,rgba(0,0,0,.08) 3px),
    repeating-linear-gradient(90deg,transparent,transparent 80px,rgba(200,184,144,.02) 80px,rgba(200,184,144,.02) 81px);
  mix-blend-mode:multiply;
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;
  background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.45) 100%);
}

/* ─── SCREENS ─────────────────────────────────────────────────── */
.screen{position:fixed;inset:0;display:none;flex-direction:column;overflow:hidden;z-index:5;}
.screen[data-active]{display:flex}

/* ─── SHARED 3D CANVAS ────────────────────────────────────────── */
/* z-index 6: ABOVE screens (5) so it paints over them where we render,
   stays transparent everywhere else so screen UI shows through.
   Pointer-events toggled by JS — none on lobby/select, auto in game. */
#three-canvas{
  position:fixed;inset:0;width:100vw;height:100vh;
  pointer-events:none;z-index:6;
}

/* ─── LOBBY ───────────────────────────────────────────────────── */
#screen-lobby{
  align-items:center;justify-content:center;
  background:
    radial-gradient(ellipse 60% 50% at 50% 110%, rgba(168,56,40,0.06), transparent),
    radial-gradient(ellipse 80% 80% at 50% 20%, rgba(106,138,58,0.04), transparent),
    var(--bg);
}
.lobby-frame{
  width:min(440px, 92vw);padding:36px 32px 30px;
  background:linear-gradient(180deg, var(--panel) 0%, var(--panel2) 100%);
  border:1px solid var(--border);
  position:relative;
  box-shadow:0 0 40px rgba(0,0,0,.5), inset 0 0 80px rgba(0,0,0,.25);
}
/* ornamental corner marks */
.lobby-frame::before,.lobby-frame::after{
  content:'';position:absolute;width:18px;height:18px;
  border:1px solid var(--gold);
}
.lobby-frame::before{top:6px;left:6px;border-right:none;border-bottom:none}
.lobby-frame::after{bottom:6px;right:6px;border-left:none;border-top:none}
.lobby-corner{position:absolute;width:18px;height:18px;border:1px solid var(--gold);}
.lobby-corner.tr{top:6px;right:6px;border-left:none;border-bottom:none}
.lobby-corner.bl{bottom:6px;left:6px;border-right:none;border-top:none}

.lobby-title{
  font-family:var(--fHead);font-size:2rem;letter-spacing:.06em;
  color:var(--inkH);text-align:center;margin-bottom:.05em;
  text-shadow:0 0 18px rgba(200,168,80,.18);
}
.lobby-sub{
  font-family:var(--fSer);font-style:italic;font-size:.95rem;
  color:var(--dim);text-align:center;margin-bottom:24px;
  letter-spacing:.02em;
}
.lobby-ornament{
  text-align:center;color:var(--gold);font-size:.9rem;
  margin:8px 0 22px;letter-spacing:.4em;
}
.lobby-label{
  font-family:var(--fHead);font-size:.6rem;letter-spacing:.32em;
  color:var(--dim);display:block;margin-bottom:6px;text-align:center;
}
.lobby-input{
  width:100%;padding:11px 12px;font-family:var(--fSer);font-size:1.15rem;
  letter-spacing:.22em;text-align:center;text-transform:uppercase;
  background:var(--bg);border:1px solid var(--border);color:var(--inkH);
  outline:none;transition:border-color .14s;
}
.lobby-input:focus{border-color:var(--gold)}

.lobby-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.btn{
  font-family:var(--fHead);font-size:.66rem;letter-spacing:.22em;
  padding:12px 14px;cursor:pointer;background:transparent;
  border:1px solid var(--border);color:var(--ink);
  transition:all .14s;text-transform:uppercase;
}
.btn:hover:not(:disabled){border-color:var(--gold);color:var(--inkH);background:rgba(200,168,80,.06)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{border-color:var(--moss);color:var(--moss)}
.btn.primary:hover:not(:disabled){border-color:var(--moss);color:var(--inkH);background:rgba(106,138,58,.12)}
.btn.danger{border-color:var(--rust);color:var(--rust)}
.btn.danger:hover:not(:disabled){background:rgba(168,56,40,.1);color:var(--inkH)}

.lobby-status{
  margin-top:18px;font-family:var(--fSer);font-style:italic;
  font-size:.85rem;color:var(--dim);text-align:center;min-height:1.2em;
}
.lobby-status.ok{color:var(--moss)}
.lobby-status.err{color:var(--rust)}

/* ─── SELECT ──────────────────────────────────────────────────── */
#screen-select{
  background:var(--bg);
  flex-direction:column;
}
.sel-top{
  padding:14px 22px;border-bottom:1px solid var(--border);
  background:linear-gradient(180deg, var(--panel2) 0%, var(--bg) 100%);
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  flex-shrink:0;
}
.sel-title{
  font-family:var(--fHead);font-size:1.1rem;letter-spacing:.16em;color:var(--inkH);
}
.sel-subtitle{
  font-family:var(--fSer);font-style:italic;font-size:.82rem;color:var(--dim);
  margin-top:2px;
}
.sel-room{
  font-family:var(--fHead);font-size:.55rem;letter-spacing:.3em;
  padding:5px 10px;border:1px solid var(--border);color:var(--ink);
}

.sel-body{
  flex:1;min-height:0;display:flex;gap:0;
  /* the two children manage their own scroll */
}
.sel-main{
  flex:1 1 auto;min-width:0;overflow-y:auto;
  padding:14px 22px 18px;
}
.sel-attrs{
  flex:0 0 280px;min-width:0;overflow-y:auto;
  border-left:1px solid var(--border);
  background:linear-gradient(180deg, var(--panel2) 0%, var(--bg) 60%);
  padding:14px 16px 18px;
}
.sel-attrs-head{
  font-family:var(--fHead);font-size:.65rem;letter-spacing:.28em;
  color:var(--inkH);margin-bottom:4px;
}
.sel-attrs-sub{
  font-family:var(--fSer);font-style:italic;font-size:.74rem;
  color:var(--dim);margin-bottom:14px;
}
.attr-card{
  padding:9px 0 10px;border-bottom:1px dashed var(--border);
}
.attr-card:last-child{border-bottom:none}
.attr-card-name{
  font-family:var(--fHead);font-size:.62rem;letter-spacing:.18em;
  color:var(--inkH);margin-bottom:5px;display:flex;align-items:baseline;
  gap:8px;
}
.attr-card-name .totals{
  margin-left:auto;font-family:var(--fSer);font-style:italic;
  font-size:.62rem;color:var(--dim);letter-spacing:.04em;
}
.attr-row{
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;padding:1px 0;font-family:var(--fSer);font-size:.78rem;
}
.attr-row .lbl{color:var(--dim);letter-spacing:.02em}
.attr-dots{display:flex;gap:3px}
.attr-dot{
  width:9px;height:9px;border-radius:50%;
  border:1px solid var(--border);background:var(--bg);
}
.attr-dot.on{
  background:var(--gold);border-color:var(--gold);
  box-shadow:0 0 5px rgba(200,168,80,.4);
}

@media (max-width:760px){
  .sel-body{flex-direction:column}
  .sel-attrs{
    flex:0 0 auto;max-height:42vh;border-left:none;
    border-top:1px solid var(--border);
  }
}

.class-row{
  margin-bottom:18px;
}
.class-head{
  display:flex;align-items:baseline;gap:14px;margin-bottom:6px;
  padding-bottom:4px;border-bottom:1px dashed var(--border);
}
.class-name{
  font-family:var(--fHead);font-size:.78rem;letter-spacing:.22em;
  color:var(--inkH);
}
.class-flavor{
  font-family:var(--fSer);font-style:italic;font-size:.78rem;color:var(--dim);
}

.variant-grid{
  display:flex;flex-wrap:wrap;gap:10px;
}
.variant{
  position:relative;background:var(--panel);
  border:1px solid var(--border);cursor:pointer;
  transition:all .15s;
  aspect-ratio:1/1.15;
  overflow:hidden;
  display:flex;flex-direction:column;
  flex: 0 1 calc(33.33% - 7px);
  min-width: 92px;
  max-width: 170px;
}
.variant:hover{border-color:var(--borderH);background:var(--panel2)}
.variant.selected{
  border-color:var(--gold);
  background:var(--panel2);
  box-shadow:0 0 0 1px var(--gold) inset, 0 0 18px rgba(200,168,80,.18);
}
.variant.selected::before,
.variant.selected::after{
  content:'';position:absolute;width:10px;height:10px;border:1px solid var(--gold);
  z-index:3;
}
.variant.selected::before{top:3px;left:3px;border-right:none;border-bottom:none}
.variant.selected::after{bottom:3px;right:3px;border-left:none;border-top:none}

.variant-slot{
  /* This is the transparent rectangle the shared 3D renderer paints into */
  position:relative;flex:1 1 auto;min-height:0;
  /* The actual 3D is rendered by the shared canvas behind this element */
}
.variant-foot{
  position:relative;padding:4px 6px 5px;
  font-family:var(--fSer);font-size:.7rem;color:var(--ink);
  text-align:center;letter-spacing:.04em;
  border-top:1px solid var(--border);
  background:linear-gradient(180deg, transparent, rgba(0,0,0,.18));
  flex-shrink:0;
}
.variant-species{
  font-family:var(--fSer);font-style:italic;font-size:.65rem;
  color:var(--dim);
}

/* color picker (player marker) */
.color-section{margin-bottom:18px}
.color-swatches{
  display:flex;flex-wrap:wrap;gap:8px;padding:4px 0 2px;
}
.swatch{
  position:relative;width:32px;height:32px;border-radius:50%;
  border:1px solid var(--border);cursor:pointer;padding:0;
  transition:transform .14s, box-shadow .14s, opacity .14s, border-color .14s;
  background-clip:padding-box;
}
.swatch:hover:not(.taken):not(:disabled){
  transform:scale(1.12);border-color:var(--gold);
}
.swatch.selected{
  border-color:var(--gold);
  box-shadow:
    0 0 0 2px var(--gold),
    0 0 14px rgba(200,168,80,.4),
    inset 0 0 0 1px rgba(0,0,0,.25);
}
.swatch.taken{
  cursor:not-allowed;opacity:.22;filter:grayscale(.4);
}
.swatch.taken::after{
  content:'';position:absolute;inset:0;
  background:
    linear-gradient(45deg,transparent 47%,var(--rust) 47%,var(--rust) 53%,transparent 53%),
    linear-gradient(-45deg,transparent 47%,var(--rust) 47%,var(--rust) 53%,transparent 53%);
  border-radius:50%;
}

.sel-bottom{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:12px 22px;border-top:1px solid var(--border);
  background:linear-gradient(0deg, var(--panel2) 0%, var(--bg) 100%);
  flex-shrink:0;
}
.sel-player{
  display:flex;align-items:center;gap:10px;
  font-family:var(--fSer);font-size:.95rem;
}
.sel-player-name{color:var(--inkH);font-family:var(--fHead);font-size:.7rem;letter-spacing:.2em}
.sel-player-state{font-style:italic;color:var(--dim);font-size:.85rem}
.sel-player-state.ready{color:var(--moss)}
.sel-count{
  display:inline-block;padding:2px 8px;margin-left:6px;
  font-family:var(--fHead);font-size:.6rem;letter-spacing:.2em;
  border:1px solid var(--border);color:var(--ink);
}
.sel-count.full{border-color:var(--moss);color:var(--moss)}

/* ─── GAME ────────────────────────────────────────────────────── */
/* Game screen sits ABOVE the canvas (z=6) so its overlay UI is visible.
   Its own background is transparent so the canvas (3D scene) shows through,
   and pointer-events:none lets clicks fall through to the canvas
   (for OrbitControls) except on the actual UI elements which re-enable
   pointer-events: auto on themselves. */
#screen-game{
  background:transparent;
  z-index:7;
  pointer-events:none;
}
#game-wrap{
  position:absolute;inset:0;
  pointer-events:none;
}
.game-hud{
  position:absolute;top:0;left:0;right:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 18px;background:linear-gradient(180deg,rgba(20,22,14,.86),transparent);
  pointer-events:none;z-index:10;gap:10px;
}
.game-hud .left,.game-hud .right,.game-hud .center{
  display:flex;align-items:center;gap:8px;pointer-events:auto;
}
.game-hud .center{flex:1;justify-content:center}
.hud-tag{
  font-family:var(--fHead);font-size:.55rem;letter-spacing:.22em;color:var(--ink);
  padding:5px 9px;border:1px solid var(--border);background:rgba(20,22,14,.6);
}
.hud-tag.me{border-color:var(--moss);color:var(--moss)}
.hud-tag.them{border-color:var(--rust);color:var(--rust)}
.hud-tag.turn{
  font-size:.65rem;padding:6px 14px;letter-spacing:.28em;
}
.hud-tag.turn.mine{
  border-color:var(--gold);color:var(--gold);
  box-shadow:0 0 12px rgba(200,168,80,.25);
  text-shadow:0 0 6px rgba(200,168,80,.4);
}
.hud-tag.turn.theirs{
  border-color:var(--rust);color:var(--rust);
}

.btn-game{
  font-family:var(--fHead);font-size:.6rem;letter-spacing:.18em;
  padding:7px 12px;cursor:pointer;background:rgba(20,22,14,.7);
  border:1px solid var(--border);color:var(--ink);transition:all .14s;
  text-transform:uppercase;pointer-events:auto;
}
.btn-game:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
.btn-game:active:not(:disabled){transform:scale(.96)}
.btn-game:disabled{opacity:.35;cursor:not-allowed}

/* unit-bar — selection at bottom */
.unit-bar{
  position:absolute;bottom:0;left:0;right:0;
  display:flex;gap:6px;padding:8px 12px 10px;overflow-x:auto;
  background:linear-gradient(0deg, rgba(20,22,14,.92), rgba(20,22,14,.65) 70%, transparent);
  border-top:1px solid var(--border);
  z-index:90;pointer-events:auto;scrollbar-width:thin;
}
.unit-bar.hidden{display:none}
.unit-card{
  position:relative;flex-shrink:0;
  width:68px;min-height:84px;
  background:var(--panel);border:1px solid var(--border);
  cursor:pointer;display:flex;flex-direction:column;
  transition:all .14s;padding:5px 4px 4px;
  font-family:var(--fSer);
}
.unit-card:hover:not(.locked):not(.dead):not(.disabled){
  border-color:var(--gold);background:var(--panel2);
}
.unit-card.selected{
  border-color:var(--gold);
  box-shadow:0 0 0 1px var(--gold) inset, 0 0 14px rgba(200,168,80,.3);
}
.unit-card.locked,.unit-card.dead,.unit-card.disabled{
  cursor:not-allowed;opacity:.32;filter:grayscale(.6);
}
.unit-card.dead{opacity:.16}
.uc-cls{
  font-family:var(--fHead);font-size:.46rem;letter-spacing:.12em;
  color:var(--inkH);text-align:center;
}
.uc-spec{
  font-style:italic;font-size:.62rem;color:var(--dim);
  text-align:center;line-height:1.1;margin-top:auto;
}
.uc-hp{
  position:absolute;top:3px;right:4px;
  font-family:var(--fSer);font-size:.6rem;color:var(--inkH);
  background:rgba(0,0,0,.55);padding:0 4px;border-radius:1px;
}
.uc-marker{
  position:absolute;top:3px;left:4px;
  width:8px;height:8px;border-radius:50%;
}

/* arrow pad — appears when a unit is selected and can still move */
.arrow-pad{
  position:absolute;bottom:108px;right:18px;
  display:grid;
  grid-template-columns:repeat(3, 46px);
  grid-template-rows:   repeat(3, 46px);
  gap:3px;z-index:95;pointer-events:auto;
}
.arrow-pad.hidden{display:none}
.arrow-pad .arrow{
  font-family:var(--fHead);font-size:1.3rem;
  background:rgba(20,22,14,.78);border:1px solid var(--gold);
  color:var(--gold);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .12s;
}
.arrow-pad .arrow:hover:not(:disabled){
  background:rgba(200,168,80,.16);
  box-shadow:0 0 12px rgba(200,168,80,.25);
}
.arrow-pad .arrow:active:not(:disabled){transform:scale(.92)}
.arrow-pad .arrow:disabled{opacity:.25;cursor:not-allowed;border-color:var(--border);color:var(--dim)}
.arrow-pad .arrow.up   {grid-column:2;grid-row:1}
.arrow-pad .arrow.left {grid-column:1;grid-row:2}
.arrow-pad .arrow.right{grid-column:3;grid-row:2}
.arrow-pad .arrow.down {grid-column:2;grid-row:3}
.arrow-pad .pad-center{
  grid-column:2;grid-row:2;
  display:flex;align-items:center;justify-content:center;
  background:rgba(20,22,14,.6);border:1px dashed var(--border);
  font-family:var(--fHead);font-size:.95rem;color:var(--gold);
}

@media (max-width:560px){
  .arrow-pad{bottom:118px;right:8px;grid-template-columns:repeat(3, 40px);grid-template-rows:repeat(3, 40px)}
  .unit-card{width:60px;min-height:76px}
}

/* ─── MISC ────────────────────────────────────────────────────── */
.divider{
  height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent);
  margin:14px 0;
}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border)}
::-webkit-scrollbar-thumb:hover{background:var(--borderH)}

/* ─── ATTACK CARD OVERLAY ─────────────────────────────────────── */
.card-overlay{
  position:fixed;inset:0;
  background:rgba(20,22,14,.88);
  z-index:200;pointer-events:none;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  opacity:0;visibility:hidden;
  transition:opacity .35s ease, visibility .35s;
}
.card-overlay.show{ opacity:1;visibility:visible;pointer-events:auto; }
.card-stage{
  display:flex;gap:22px;
  perspective:1200px;
  padding:0 16px;
}
.card{
  width:140px;height:196px;
  position:relative;
  transform-style:preserve-3d;
  transition:transform .55s cubic-bezier(.22,.7,.34,1.02);
  transform:rotateY(180deg);
  flex-shrink:0;
}
.card.flipped{ transform:rotateY(0deg); }
.card-back,.card-face{
  position:absolute;inset:0;
  border-radius:6px;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  box-shadow:0 8px 22px rgba(0,0,0,.55), 0 0 0 1px rgba(200,168,80,.2);
}
.card-back{
  background:
    repeating-linear-gradient(45deg, #1f1f12 0 4px, #2a2a18 4px 8px),
    #1a1a0e;
  border:2px solid var(--gold);
  transform:rotateY(180deg);
  display:flex;align-items:center;justify-content:center;
}
.card-back::after{
  content:'✦';font-family:var(--fHead);
  font-size:2.4rem;color:var(--gold);opacity:.45;
}
.card-face{
  background:#14160e;
  border:2px solid var(--gold);
  overflow:hidden;
}
.card-face img{
  width:100%;height:100%;object-fit:cover;display:block;
}
.card-result{
  margin-top:32px;
  opacity:0;transform:translateY(8px);
  transition:opacity .4s, transform .4s;
  font-family:var(--fHead);
  letter-spacing:.32em;
  text-align:center;
  padding:14px 28px;
  background:rgba(20,22,14,.85);
  border:1px solid var(--border);
  min-width:280px;
}
.card-result.show{ opacity:1;transform:translateY(0); }
.card-result .res-headline{ font-size:1.25rem; }
.card-result .res-detail  { margin-top:6px;opacity:.85;font-size:.85rem;letter-spacing:.18em; }
.card-result.normal   { color:var(--ink);  border-color:var(--ink); }
.card-result.crit     { color:var(--gold); border-color:var(--gold);

};

function drawCard(){
  let r = Math.random() * CARD_TOTAL_WEIGHT;
  for (const id in CARDS){
    r -= CARDS[id].weight;
    if (r <= 0) return id;
  }
  return 'card_reg_1'; // fallback
}

function draw3(){ return [drawCard(), drawCard(), drawCard()]; }

function resolveAttackCards(cards, baseDmg){
  const crows = cards.filter(c => CARDS[c].kind === 'crow').length;
  const wasps = cards.filter(c => CARDS[c].kind === 'wasp').length;
  // Priority: critical failure > crit hit > normal fail > normal hit
  if (crows >= 2) return { outcome:'critfail', damage:0,           selfDamage:2 };
  if (wasps >= 2) return { outcome:'crit',     damage:baseDmg + 2, selfDamage:0 };
  if (crows >= 1) return { outcome:'fail',     damage:0,           selfDamage:0 };
  return                  { outcome:'normal',  damage:baseDmg,     selfDamage:0 };
}

function isInAttackRange(attacker, target){
  if (!attacker || !target || !target.alive) return false;
  if (attacker.side === target.side) return false;
  // orthogonal only: must share row or column
  const dCol = target.col - attacker.col;
  const dRow = target.row - attacker.row;
  if (dCol !== 0 && dRow !== 0) return false;
  const dist = Math.abs(dCol) + Math.abs(dRow);
  return dist >= 1 && dist <= attacker.atk;
}

function getAttackTargets(attackerKey){
  const a = G.units && G.units[attackerKey];
  if (!a) return [];
  return Object.values(G.units).filter(t => isInAttackRange(a, t));
}

/* ──────────────────────────────────────────────────────────────

   ────────────────────────────────────────────────────────────── */
function mulberry32(seed){
  let t = seed >>> 0;
  return function(){
    t = (t + 0x6D2B79F5) >>> 0;
    let r = t;
    r = Math.imul(r ^ (r >>> 15), r | 1);
    r ^= r + Math.imul(r ^ (r >>> 7), r | 61);
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffleSeeded(arr, rng){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.autoClear = false;
  renderer.domElement.id = 'three-canvas';
  document.body.appendChild(renderer.domElement);

  addEventListener('resize', () => {
    renderer.setSize(innerWidth, innerHeight, false);
  });
}

/* ──────────────────────────────────────────────────────────────
   GLB LOADING — cached, Draco-enabled
   ────────────────────────────────────────────────────────────── */
const loader = new GLTFLoader();
{
  const draco = new DRACOLoader();
  draco.setDecoderPath('https://unpkg.com/three@0.162.0/examples/jsm/libs/draco/');
  loader.setDRACOLoader(draco);
}

const modelCache = {};  // unitId → Promise<GLTF>

function loadUnit(unitId){
  if (modelCache[unitId]) return modelCache[unitId];
  modelCache[unitId] = new Promise((resolve, reject) => {
    const url = BASE + unitId + '.glb';
    loader.load(
      url,
      gltf => {
        console.log('[load] ok:', unitId);
        resolve(gltf);
      },
      undefined,
      err => {
        console.warn('[load] FAILED:', unitId, err && err.message || err);
        // Diagnose root cause
        fetch(url).then(r => {
          console.warn('[load] '+unitId+' → HTTP '+r.status+' · type='+r.headers.get('content-type')+' · len='+r.headers.get('content-length'));
          return r.arrayBuffer();
        }).then(buf => {
          try {
            const text = new TextDecoder('utf-8',{fatal:false}).decode(buf.slice(0, Math.min(200, buf.byteLength)));
            if (text.startsWith('version https://git-lfs')){
              console.warn('[load] '+unitId+' is a git-LFS pointer. GitHub Pages does not serve LFS — untrack and re-add as normal blob.');
            } else if (text.startsWith('<')){
              console.warn('[load] '+unitId+' returned HTML (probably 404). First bytes:\n'+text);
            } else {
              console.warn('[load] '+unitId+' first bytes:\n'+text);
            }
          } catch(e){}
        }).catch(e => {
          console.warn('[load] '+unitId+' fetch also failed:', e.message || e);
          console.warn('[load] If you opened this file via file:// — browsers block GLB loading. Use a local web server (python -m http.server) or push to GitHub Pages.');
        });
        reject(err);
      }
    );
  });
  return modelCache[unitId];
}

/* ──────────────────────────────────────────────────────────────
   GRADIENT TINT — 6 discrete horizontal bands along local Y
   index 0 = TOP, index 5 = BOTTOM
   ────────────────────────────────────────────────────────────── */
function applyGradient(mesh, stops){
  if (!mesh.material || !mesh.geometry) return;
  if (!mesh.geometry.boundingBox) mesh.geometry.computeBoundingBox();
  const bb = mesh.geometry.boundingBox;
  const yMin = bb.min.y, yMax = bb.max.y;

  const cols = stops.map(s => new THREE.Color(s));

  const oldMat = mesh.material;
  const newMat = oldMat.clone();
  newMat.color = new THREE.Color(0xffffff);
  newMat.map   = null;                 // bands must be pure (no diffuse texture)
  if ('roughness' in newMat) newMat.roughness = 0.78;
  if ('metalness' in newMat) newMat.metalness = 0.05;
  if (newMat.emissiveMap) newMat.emissiveMap = null;
  if ('emissive' in newMat) newMat.emissive = new THREE.Color(0x000000);

  newMat.onBeforeCompile = (shader) => {
    shader.uniforms.uYMin = { value:yMin };
    shader.uniforms.uYMax = { value:yMax };
    shader.uniforms.uS0   = { value:cols[0] };
    shader.uniforms.uS1   = { value:cols[1] };
    shader.uniforms.uS2   = { value:cols[2] };
    shader.uniforms.uS3   = { value:cols[3] };
    shader.uniforms.uS4   = { value:cols[4] };
    shader.uniforms.uS5   = { value:cols[5] };

    shader.vertexShader =
      'varying float vGradY;\n' +
      shader.vertexShader.replace(
        '#include <begin_vertex>',
        '#include <begin_vertex>\n  vGradY = position.y;'
      );

    shader.fragmentShader =
      'varying float vGradY;\n' +
      'uniform float uYMin;\nuniform float uYMax;\n' +
      'uniform vec3 uS0;\nuniform vec3 uS1;\nuniform vec3 uS2;\n' +
      'uniform vec3 uS3;\nuniform vec3 uS4;\nuniform vec3 uS5;\n' +
      shader.fragmentShader.replace(
        '#include <color_fragment>',
        `
        #include <color_fragment>
        // Soft 6-stop gradient along local Y.
        // index 0 (uS0) = TOP, index 5 (uS5) = BOTTOM.
        float gradT = clamp((vGradY - uYMin) / max(uYMax - uYMin, 0.0001), 0.0, 1.0);
        // (1 - gradT) maps top→0, bottom→1; scale × 5 to span 5 segments.
        float pos = (1.0 - gradT) * 5.0;
        // min() instead of clamp on the index keeps f correct at the bottom edge
        float fi = min(floor(pos), 4.0);
        int   i  = int(fi);
        if (i < 0) { i = 0; }
        float f = pos - fi;                      // 0..1 within segment
        f = smoothstep(0.0, 1.0, f);             // slight band-character
        vec3 c0, c1;
        if      (i == 0) { c0 = uS0; c1 = uS1; }   // top segment
        else if (i == 1) { c0 = uS1; c1 = uS2; }
        else if (i == 2) { c0 = uS2; c1 = uS3; }
        else if (i == 3) { c0 = uS3; c1 = uS4; }
        else             { c0 = uS4; c1 = uS5; }   // bottom segment
        diffuseColor.rgb = mix(c0, c1, f);
        `
      );
  };
  newMat.needsUpdate = true;
  mesh.material = newMat;
}

/* Clone a loaded GLTF scene, normalize scale/origin, apply gradient. */
function buildUnitMesh(unitId, targetHeight = 1.6){
  return loadUnit(unitId).then(gltf => {
    const root = gltf.scene.clone(true);

    // Normalize: scale so model height ≈ targetHeight, drop to y=0
    const box = new THREE.Box3().setFromObject(root);
    const size = new THREE.Vector3(); box.getSize(size);
    const h = Math.max(size.y, 0.001);
    const s = targetHeight / h;
    root.scale.setScalar(s);

    // After scaling: recompute box, center XZ, sit on ground
    const box2 = new THREE.Box3().setFromObject(root);
    const center = new THREE.Vector3(); box2.getCenter(center);
    root.position.x -= center.x;
    root.position.z -= center.z;
    root.position.y -= box2.min.y;

    // Apply gradient
    const stops = SPECIES_GRADIENT[UNIT_SPECIES[unitId]];
    root.traverse(c => {
      if (c.isMesh){
        c.castShadow = true; c.receiveShadow = true;
        // unique material per mesh instance
        c.material = c.material.clone();
        if (stops) applyGradient(c, stops);
      }
    });

    return root;
  });
}

/* ──────────────────────────────────────────────────────────────
   PREVIEW SCENES — one tiny scene per variant
   ────────────────────────────────────────────────────────────── */
function buildPreviewScene(unitId){
  const scene = new THREE.Scene();
  scene.background = null;

  const amb = new THREE.AmbientLight(0xc8b890, 0.95);
  scene.add(amb);
  const dir = new THREE.DirectionalLight(0xfff0d0, 1.5);
  dir.position.set(2, 4, 3);
  scene.add(dir);
  const rim = new THREE.DirectionalLight(0x88a060, 0.7);
  rim.position.set(-3, 2, -2);
  scene.add(rim);

  const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 50);
  camera.position.set(0, 1.4, 4.2);
  camera.lookAt(0, 0.85, 0);

  // a faint floor disc to anchor the figure
  const discGeo = new THREE.CircleGeometry(1.0, 32);
  const discMat = new THREE.MeshBasicMaterial({ color:0x2a2a1a, transparent:true, opacity:0.55 });
  const disc = new THREE.Mesh(discGeo, discMat);
  disc.rotation.x = -Math.PI/2;
  disc.position.y = 0.005;
  scene.add(disc);

  const root = new THREE.Group();
  scene.add(root);

  // Loading placeholder: small spinning cube with species color so we can
  // visually confirm rendering works even before the GLB finishes loading.
  const stops = SPECIES_GRADIENT[UNIT_SPECIES[unitId]] || ['#c8b890'];
  const phCol = new THREE.Color(stops[1] || stops[0]);
  const phGeo = new THREE.BoxGeometry(0.55, 0.55, 0.55);
  const phMat = new THREE.MeshStandardMaterial({
    color: phCol, roughness: 0.7, metalness: 0.1,
    emissive: phCol, emissiveIntensity: 0.15,
  });
  const placeholder = new THREE.Mesh(phGeo, phMat);
  placeholder.position.y = 0.85;
  root.add(placeholder);

  const entry = {
    scene, camera, root, placeholder,
    model:null,
    rotateSpeed: 0.5,
    selected:false,
    loaded:false,
  };
  previews[unitId] = entry;

  buildUnitMesh(unitId, 1.6).then(model => {
    entry.model = model;
    entry.loaded = true;
    // remove placeholder, add real model
    if (entry.placeholder){
      entry.root.remove(entry.placeholder);
      entry.placeholder.geometry.dispose();
      entry.placeholder.material.dispose();
      entry.placeholder = null;
    }
    entry.root.add(model);
  }).catch(()=>{ /* placeholder stays as a visible failed-state marker */ });

  return entry;
}

/* ──────────────────────────────────────────────────────────────
   TURN / MOVEMENT HELPERS
   ────────────────────────────────────────────────────────────── */

// Direction → (dcol, drow) mapped to player's perspective.
// Both cameras look across the board from one z-edge to the other.
// For HOST (at z<0 looking toward +z): the player's right in world space is -x.
// For GUEST (at z>BOARD looking toward -z): the player's right in world space is +x.
function getMoveDelta(dir, side){
  const forward = (side === 'host') ? +1 : -1; // row delta toward opponent
  const rightX  = (side === 'host') ? -1 : +1; // col delta toward player's right
  switch(dir){
    case 'up':    return [0,        forward];
    case 'down':  return [0,       -forward];
    case 'right': return [rightX,   0];
    case 'left':  return [-rightX,  0];
    default:      return [0, 0];
  }
}

function isOccupied(col, row, exceptKey){
  if (!G.units) return false;
  return Object.values(G.units).some(u => u.alive && u.key !== exceptKey && u.col === col && u.row === row);
}

// BFS over orthogonal neighbours; respects board bounds and blocking units.
function computeReachable(startCol, startRow, range, exceptKey){
  const out = []; // [{col, row, cost}]
  if (range <= 0) return out;
  const seen = new Set();
  seen.add(startCol + ',' + startRow);
  const queue = [[startCol, startRow, 0]];
  while (queue.length){
    const [c, r, cost] = queue.shift();
    if (cost >= range) continue;
    for (const [dc, dr] of [[0,1],[0,-1],[1,0],[-1,0]]){
      const nc = c + dc, nr = r + dr;
      if (nc < 0 || nc >= BOARD || nr < 0 || nr >= BOARD) continue;
      const k = nc + ',' + nr;
      if (seen.has(k)) continue;
      if (isOccupied(nc, nr, exceptKey)) continue;
      seen.add(k);
      out.push({ col:nc, row:nr, cost: cost+1 });
      queue.push([nc, nr, cost+1]);
    }
  }
  return out;
}

function applyMove(unitKey, newCol, newRow){
  const u = G.units && G.units[unitKey];
  if (!u || !u.alive) return false;
  if (Math.abs(newCol - u.col) + Math.abs(newRow - u.row) !== 1) return false;
  if (newCol < 0 || newCol >= BOARD || newRow < 0 || newRow >= BOARD) return false;
  if (isOccupied(newCol, newRow, unitKey)) return false;
  if (G.turn.remainingMove <= 0) return false;
  u.col = newCol; u.row = newRow;
  G.turn.remainingMove -= 1;
  return true;
}

function endTurnState(){
  // Only mark figure as "used" if it actually moved or attacked.
  if (G.turn.selectedKey){
    const u = G.units[G.turn.selectedKey];
    const moved    = u && (G.turn.remainingMove < u.mov);
    const attacked = G.turn.attacked[G.turn.side];
    G.turn.lastMoved[G.turn.side] = (moved || attacked) ? G.turn.selectedKey : null;
  } else {
    G.turn.lastMoved[G.turn.side] = null;
  }
  G.turn.selectedKey   = null;
  G.turn.remainingMove = 0;
  G.turn.attackTarget  = null;
  // Reset the attack-used flag for the side about to play (don't touch current side's flag — already used)
  const nextSide = (G.turn.side === 'host') ? 'guest' : 'host';
  G.turn.attacked[nextSide] = false;
  G.turn.side    = nextSide;
  G.turn.number += 1;
}

/* ──────────────────────────────────────────────────────────────
   GAME SCENE — 8×8 tile board + 16 units
   ────────────────────────────────────────────────────────────── */
const TILE = 2;           // world units per tile
const BOARD = 8;
const GAME = { units:{} }; // unitObjectId → THREE.Group

function setupGameScene(){
  if (gameScene) return;
  gameScene = new THREE.Scene();
  gameScene.background = new THREE.Color(0x14160e);
  gameScene.fog = new THREE.FogExp2(0x14160e, 0.008);

  // lights
  const amb = new THREE.AmbientLight(0xcab890, 1.05);
  gameScene.add(amb);
  // hemisphere — sky/ground for soft fill
  const hemi = new THREE.HemisphereLight(0xfff0c8, 0x3a3a20, 0.55);
  gameScene.add(hemi);

  const cx = (BOARD-1)*TILE / 2;

  const sun = new THREE.DirectionalLight(0xfff0d0, 1.45);
  sun.position.set(cx - 6, 22, cx + 8);
  sun.target.position.set(cx, 0, cx);
  gameScene.add(sun.target);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far  = 80;
  sun.shadow.camera.left = -BOARD*TILE;
  sun.shadow.camera.right=  BOARD*TILE;
  sun.shadow.camera.top  =  BOARD*TILE;
  sun.shadow.camera.bottom= -BOARD*TILE;
  sun.shadow.bias = -0.0005;
  gameScene.add(sun);

  const moss = new THREE.PointLight(0x88a050, 0.35, 30);
  moss.position.set(cx, 6, cx);
  gameScene.add(moss);

  // camera — positioned so MY units sit at the near edge
  gameCamera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);
  const isHost = (ME.side === 'host');
  const camZ = isHost ? (-BOARD*TILE*0.55) : (BOARD*TILE * 1.55);
  gameCamera.position.set(cx, BOARD*TILE * 0.95, camZ);
  gameCamera.lookAt(cx, 0, cx);

  gameControls = new OrbitControls(gameCamera, renderer.domElement);
  gameControls.target.set(cx, 0, cx);
  gameControls.enableDamping = true;
  gameControls.dampingFactor = 0.08;
  gameControls.maxPolarAngle = Math.PI * 0.46;
  gameControls.minDistance = 8;
  gameControls.maxDistance = 40;
  gameControls.enablePan = false;
  gameControls.update();
}

function buildBoard(seed){
  // Remove any existing tiles
  for (let i = gameScene.children.length - 1; i >= 0; i--){
    const c = gameScene.children[i];
    if (c.userData && c.userData.isTile) gameScene.remove(c);
  }

  const tex = new THREE.TextureLoader();
  // Track each material so we can apply fallback color only on actual load failure
  const t1Mats = [], t2Mats = [];
  const onTexFail = (which, mats, fallback) => () => {
    console.warn('[tile] failed to load ' + which + ' — using fallback color');
    mats.forEach(m => { m.map = null; m.color.setHex(fallback); m.needsUpdate = true; });
  };

  const t1 = tex.load(BASE + 'tile_1.png', undefined, undefined, onTexFail('tile_1.png', t1Mats, 0x4a5530));
  const t2 = tex.load(BASE + 'tile_2.png', undefined, undefined, onTexFail('tile_2.png', t2Mats, 0x3a4525));
  [t1,t2].forEach(t => {
    t.colorSpace = THREE.SRGBColorSpace;
    t.magFilter = THREE.NearestFilter;
    t.minFilter = THREE.LinearMipmapNearestFilter;
    t.anisotropy = 8;
  });

  const rng = mulberry32(seed);
  const tileGeo = new THREE.PlaneGeometry(TILE, TILE);

  for (let x = 0; x < BOARD; x++){
    for (let z = 0; z < BOARD; z++){
      const useT1 = rng() < 0.5;
      const which = useT1 ? t1 : t2;
      // color: white so the texture comes through at full brightness
      const mat = new THREE.MeshStandardMaterial({
        map: which, color: 0xffffff,
        roughness: 0.82, metalness: 0.0,
      });
      (useT1 ? t1Mats : t2Mats).push(mat);
      const tile = new THREE.Mesh(tileGeo, mat);
      tile.rotation.x = -Math.PI/2;
      tile.position.set(x * TILE, 0, z * TILE);
      tile.receiveShadow = true;
      tile.userData.isTile = true;
      gameScene.add(tile);
    }
  }

  // subtle edge frame
  const frameGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(BOARD*TILE, 0.04, BOARD*TILE));
  const frameMat = new THREE.LineBasicMaterial({ color:0x756a3f });
  const frame = new THREE.LineSegments(frameGeo, frameMat);
  frame.position.set((BOARD-1)*TILE/2, 0.01, (BOARD-1)*TILE/2);
  frame.userData.isTile = true;
  gameScene.add(frame);
}

/* Build placeholders for all 16 units from G.units (runtime table). */
function placeAllUnits(){
  if (!G.units) return;
  Object.values(G.units).forEach(u => {
    if (GAME.units[u.key]) return; // already placed

    const facing = (u.side === 'host') ? 1 : -1;
    const playerColor = G[u.side].color || '#888888';
    const colObj = new THREE.Color(playerColor);

    const group = new THREE.Group();
    group.position.set(u.col * TILE, 0.005, u.row * TILE);
    group.rotation.y = (facing > 0) ? 0 : Math.PI;
    group.userData.isUnit = true;
    group.userData.unitKey = u.key;
    gameScene.add(group);
    GAME.units[u.key] = group;

    // Player marker disc
    const inner = new THREE.Mesh(
      new THREE.CircleGeometry(0.7, 32),
      new THREE.MeshBasicMaterial({ color:colObj, transparent:true, opacity:0.32 })
    );
    inner.rotation.x = -Math.PI/2;
    inner.position.y = 0.012;
    group.add(inner);

    const ring = new THREE.Mesh(
      new THREE.RingGeometry(0.68, 0.80, 48),
      new THREE.MeshBasicMaterial({ color:colObj, transparent:true, opacity:0.85 })
    );
    ring.rotation.x = -Math.PI/2;
    ring.position.y = 0.015;
    group.add(ring);

    // Visible cube placeholder until GLB loads — colored per species top stop
    const stops = SPECIES_GRADIENT[UNIT_SPECIES[u.unitId]] || ['#c8b890'];
    const phCol = new THREE.Color(stops[1] || stops[0]);
    const phGeo = new THREE.BoxGeometry(0.7, 1.4, 0.7);
    const phMat = new THREE.MeshStandardMaterial({
      color:phCol, roughness:0.7, metalness:0.05,
      emissive:phCol, emissiveIntensity:0.08,
    });
    const ph = new THREE.Mesh(phGeo, phMat);
    ph.position.y = 0.7;
    ph.castShadow = true;
    ph.receiveShadow = true;
    group.add(ph);
    group.userData.ph = ph;

    buildUnitMesh(u.unitId, 1.5).then(model => {
      if (group.userData.ph){
        group.remove(group.userData.ph);
        group.userData.ph.geometry.dispose();
        group.userData.ph.material.dispose();
        group.userData.ph = null;
      }
      group.add(model);
    }).catch(()=>{});
  });
}

/* Smooth-lerp every unit group toward its logical position from G.units. */
function updateUnitTransforms(dt){
  if (!G.units) return;
  const speed = 8; // lerp rate
  Object.values(G.units).forEach(u => {
    const g = GAME.units[u.key];
    if (!g) return;
    const tx = u.col * TILE;
    const tz = u.row * TILE;
    g.position.x += (tx - g.position.x) * Math.min(1, dt * speed);
    g.position.z += (tz - g.position.z) * Math.min(1, dt * speed);
    g.visible = u.alive;
  });
}

/* ──────────────────────────────────────────────────────────────
   RENDER LOOP
   ────────────────────────────────────────────────────────────── */
let lastT = 0;
function loop(t){
  raf = requestAnimationFrame(loop);
  const dt = Math.min(0.05, (t - lastT) / 1000 || 0);
  lastT = t;

  if (!renderer) return;

  renderer.setScissorTest(false);
  renderer.clear();
  renderer.setScissorTest(true);

  const screen = currentScreen();
  if (screen === 'select')  renderPreviewViews(dt);
  if (screen === 'game')    renderGameView(dt);
}

function currentScreen(){
  if (document.getElementById('screen-game').hasAttribute('data-active')) return 'game';
  if (document.getElementById('screen-select').hasAttribute('data-active')) return 'select';
  return 'lobby';
}

function renderPreviewViews(dt){
  const slots = document.querySelectorAll('.variant-slot');
  slots.forEach(slot => {
    const unitId = slot.dataset.unit;
    const p = previews[unitId];
    if (!p) return;
    const rect = slot.getBoundingClientRect();
    if (rect.bottom < 0 || rect.top > innerHeight) return;
    if (rect.right < 0  || rect.left > innerWidth) return;
    const w = Math.floor(rect.width);
    const h = Math.floor(rect.height);
    if (w < 8 || h < 8) return;

    const left   = Math.floor(rect.left);
    const bottom = Math.floor(innerHeight - rect.bottom);

    if (p.root){
      p.root.rotation.y += dt * p.rotateSpeed;
    }

    renderer.setViewport(left, bottom, w, h);
    renderer.setScissor (left, bottom, w, h);
    p.camera.aspect = w / h;
    p.camera.updateProjectionMatrix();
    renderer.render(p.scene, p.camera);
  });
}

function renderGameView(dt){
  const wrap = document.getElementById('game-wrap');
  const rect = wrap.getBoundingClientRect();
  const w = Math.floor(rect.width);
  const h = Math.floor(rect.height);
  if (w < 8 || h < 8) return;
  const left   = Math.floor(rect.left);
  const bottom = Math.floor(innerHeight - rect.bottom);

  if (gameControls) gameControls.update();
  updateUnitTransforms(dt);

  renderer.setViewport(left, bottom, w, h);
  renderer.setScissor (left, bottom, w, h);
  gameCamera.aspect = w / h;
  gameCamera.updateProjectionMatrix();
  renderer.render(gameScene, gameCamera);
}

/* ──────────────────────────────────────────────────────────────
   PEER JS
   ────────────────────────────────────────────────────────────── */
let peer = null;
let conns = [];       // host:list of guests, guest:list of [host]

function setStatus(msg, cls){
  const e = document.getElementById('lobby-status');
  e.textContent = msg;
  e.className = 'lobby-status' + (cls ? ' '+cls : '');
}

function startHost(code){
  ME.room = code; ME.isHost = true; ME.side = 'host';
  G = makeFreshState();
  setStatus('Eröffne Stube…');
  peer = new Peer('bt_'+code, { debug:0 });
  peer.on('open', () => {
    setStatus('Stube "'+code+'" geöffnet — warte auf Beitritt.', 'ok');
    peer.on('connection', c => hostAccept(c));
  });
  peer.on('error', e => {
    if (e.type === 'unavailable-id') setStatus('Code bereits belegt.', 'err');
    else setStatus('Fehler: '+e.type, 'err');
    if (peer){ try{peer.destroy();}catch{}; peer = null; }
  });
}

function startJoin(code){
  ME.room = code; ME.isHost = false; ME.side = 'guest';
  setStatus('Verbinde…');
  peer = new Peer(undefined, { debug:0 });
  peer.on('open', () => {
    const c = peer.connect('bt_'+code, { reliable:true });
    c.on('open', () => {
      conns = [c];
      setStatus('Stube "'+code+'" betreten.', 'ok');
    });
    c.on('data',  d => guestRecv(d));
    c.on('close', () => {
      setStatus('Verbindung verloren.', 'err');
      conns = [];
      goLobby();
    });
    c.on('error', e => setStatus('Fehler: '+e, 'err'));
  });
  peer.on('error', e => {
    if (e.type === 'peer-unavailable') setStatus('Keine Stube mit dem Code "'+code+'".', 'err');
    else setStatus('Fehler: '+e.type, 'err');
    if (peer){ try{peer.destroy();}catch{}; peer = null; }
  });
}

function hostAccept(c){
  conns.push(c);
  c.on('open', () => {
    G.guest.joined = true;
    if (G.state === 'LOBBY') G.state = 'SELECT';
    broadcast();
    if (currentScreen() === 'lobby') goSelect();
  });
  c.on('data',  d => hostRecv(d, c));
  c.on('close', () => {
    conns = conns.filter(x => x !== c);
    G.guest.joined = false;
    G.guest.ready  = false;
    broadcast();
  });
}

function broadcast(){
  conns.forEach(c => { try { c.send({ t:'FULL', G }); } catch {} });
  applyState();  // host also reacts to its own state changes
}

function hostRecv(msg /*, conn*/){
  if (!msg || !msg.t) return;
  if (msg.t === 'SELECT'){
    if (msg.variant === null || msg.variant === undefined){
      delete G.guest.selections[msg.cls];
    } else {
      const hasIt = G.guest.selections[msg.cls] !== undefined;
      // If this would add a new class beyond the cap, ignore.
      if (!hasIt && Object.keys(G.guest.selections).length >= PICKS_REQUIRED){
        broadcast();
        return;
      }
      G.guest.selections[msg.cls] = msg.variant;
    }
    broadcast();
  }
  if (msg.t === 'COLOR'){
    if (G.host.color !== msg.color){
      G.guest.color = msg.color;
    }
    broadcast();
  }
  if (msg.t === 'READY'){
    G.guest.ready = !!msg.ready;
    tryStartGame();
    broadcast();
  }
  // ── In-game actions ────────────────────────────────
  if (G.state !== 'PLAYING' || !G.turn) return;
  if (msg.t === 'SELECT_UNIT'){
    if (G.turn.side !== 'guest') return;
    if (G.turn.attackResult) return;
    const u = G.units[msg.key];
    if (!u || u.side !== 'guest' || !u.alive) return;
    if (G.turn.lastMoved.guest === msg.key) return;
    // Allow switching during preview phase, block after first move OR attack
    if (G.turn.selectedKey){
      if (G.turn.selectedKey === msg.key) return;
      const sel = G.units[G.turn.selectedKey];
      const committed = sel && (G.turn.remainingMove < sel.mov || G.turn.attacked.guest);
      if (committed) return;
    }
    G.turn.selectedKey   = msg.key;
    G.turn.remainingMove = u.mov;
    G.turn.attackTarget  = null;
    broadcast();
  }
  if (msg.t === 'MOVE'){
    if (G.turn.side !== 'guest') return;
    if (!G.turn.selectedKey) return;
    const u = G.units[msg.key];
    if (!u || u.key !== G.turn.selectedKey) return;
    const [dc, dr] = getMoveDelta(msg.dir, 'guest');
    if (applyMove(u.key, u.col + dc, u.row + dr)) broadcast();
  }
  if (msg.t === 'END_TURN'){
    if (G.turn.side !== 'guest') return;
    if (!G.turn.selectedKey) return;
    if (G.turn.attackResult) return; // can't end turn during animation
    endTurnState();
    broadcast();
  }
  if (msg.t === 'SET_TARGET'){
    if (G.turn.side !== 'guest') return;
    if (!G.turn.selectedKey) return;
    if (G.turn.attacked.guest) return;
    if (G.turn.attackResult) return;
    const attacker = G.units[G.turn.selectedKey];
    const target   = msg.key ? G.units[msg.key] : null;
    if (!attacker) return;
    if (msg.key === null){
      G.turn.attackTarget = null;
      broadcast();
      return;
    }
    if (!target || !isInAttackRange(attacker, target)) return;
    G.turn.attackTarget = msg.key;
    broadcast();
  }
  if (msg.t === 'ATTACK'){
    if (G.turn.side !== 'guest') return;
    if (G.turn.attacked.guest) return;
    if (G.turn.attackResult) return;
    performAttack(msg.attackerKey, msg.targetKey);
  }
}

function guestRecv(msg){
  if (!msg || !msg.t) return;
  if (msg.t === 'FULL'){
    G = msg.G;
    applyState();
  }
}

function sendToHost(msg){
  conns.forEach(c => { try { c.send(msg); } catch {} });
}

function tryStartGame(){
  const ok =
    G.host.ready && G.guest.ready &&
    G.host.color && G.guest.color &&
    Object.keys(G.host.selections).length === PICKS_REQUIRED &&
    Object.keys(G.guest.selections).length === PICKS_REQUIRED;
  if (!ok) return;
  if (G.state === 'PLAYING') return;

  // Generate seed + placements once
  G.seed = (Math.random() * 4294967295) >>> 0;
  const rng1 = mulberry32(G.seed ^ 0xA1A1A1);
  const rng2 = mulberry32(G.seed ^ 0xB2B2B2);

  // Build unit-id list from the selected classes (each player picked exactly PICKS_REQUIRED).
  const hostUnits  = Object.entries(G.host.selections).map(([cls, v]) => cls + '_' + v);
  const guestUnits = Object.entries(G.guest.selections).map(([cls, v]) => cls + '_' + v);

  G.hostPlacement  = shuffleSeeded(hostUnits, rng1);
  G.guestPlacement = shuffleSeeded(guestUnits, rng2);

  initGameRuntime();
  G.state = 'PLAYING';
}

/* ──────────────────────────────────────────────────────────────
   SCREEN ROUTING
   ────────────────────────────────────────────────────────────── */
function showScreen(name){
  ['lobby','select','game'].forEach(n => {
    const el = document.getElementById('screen-'+n);
    if (n === name) el.setAttribute('data-active','');
    else            el.removeAttribute('data-active');
  });
  // canvas only receives pointer events during game (so OrbitControls works)
  if (renderer){
    renderer.domElement.style.pointerEvents = (name === 'game') ? 'auto' : 'none';
  }
}

function goLobby(){ showScreen('lobby'); }
function goSelect(){ showScreen('select'); buildSelectionRows(); applyState(); }
function goGame(){ showScreen('game'); enterGame(); }

/* Apply current G state to UI on whichever screen is active */
function applyState(){
  if (G.state === 'PLAYING'){
    if (currentScreen() !== 'game') goGame();
    if (gameEntered) refreshTurnUI();
    return;
  }
  if (G.state === 'SELECT' || G.state === 'LOBBY'){
    if (currentScreen() === 'lobby' && G.guest.joined) goSelect();
    if (currentScreen() === 'select') refreshSelectionUI();
  }
}

/* ──────────────────────────────────────────────────────────────
   SELECTION SCREEN — build rows, handle clicks, update UI
   ────────────────────────────────────────────────────────────── */
let selectionBuilt = false;

function buildSelectionRows(){
  if (selectionBuilt) return;
  selectionBuilt = true;

  document.getElementById('sel-room-tag').textContent = ME.room;

  const main  = document.getElementById('sel-main');
  const attrs = document.getElementById('sel-attrs');
  main.innerHTML  = '';
  attrs.innerHTML = '';

  // ── Color picker section ──────────────────────────────
  const colorSec = document.createElement('div');
  colorSec.className = 'color-section';
  colorSec.innerHTML = `
    <div class="class-head">
      <span class="class-name">FÄRBUNG</span>
      <span class="class-flavor">deine Marke unter den Figuren</span>
    </div>
    <div class="color-swatches" id="color-swatches"></div>
  `;
  main.appendChild(colorSec);

  const swatchRow = colorSec.querySelector('#color-swatches');
  PLAYER_COLORS.forEach((hex, i) => {
    const btn = document.createElement('button');
    btn.className = 'swatch';
    btn.dataset.color = hex;
    btn.dataset.idx = i;
    btn.style.background = hex;
    btn.title = hex;
    btn.addEventListener('click', () => onPickColor(hex));
    swatchRow.appendChild(btn);

  // ── Class rows (left main column) ─────────────────────

    const row = document.createElement('div');

    row.innerHTML = `
      <div class="class-head">
        <span class="class-name">${CLASS_LABEL[cls].toUpperCase()}</span>
        <span class="class-flavor">${CLASS_FLAVOR[cls]}</span>
      </div>
      <div class="variant-grid" data-class="${cls}"></div>
    `;
    const grid = row.querySelector('.variant-grid');

    CLASS_VARIANTS[cls].forEach(v => {
      const unitId = cls + '_' + v;
      const species = UNIT_SPECIES[unitId];
      const tile = document.createElement('div');
      tile.className = 'variant';
      tile.dataset.class = cls;
      tile.dataset.variant = v;
      tile.dataset.unit = unitId;
      tile.innerHTML = `
        <div class="variant-slot" data-unit="${unitId}"></div>
        <div class="variant-foot">
          <span class="variant-species">${SPECIES_LABEL[species] || species}</span>
        </div>
      `;
      tile.addEventListener('click', () => onPickVariant(cls, v));
      grid.appendChild(tile);

      buildPreviewScene(unitId);
    });

    main.appendChild(row);
  });

  // ── Attributes panel (right column) ───────────────────
  const head = document.createElement('div');
  head.innerHTML = `
    <div class="sel-attrs-head">EIGENSCHAFTEN</div>
    <div class="sel-attrs-sub">jede Klasse, vier Werte</div>
  `;
  attrs.appendChild(head);

  CLASSES.forEach(cls => {
    const a = CLASS_ATTRS[cls];
    if (!a) return;
    const total = a.atk + a.mov + a.dmg + a.hp;
    const card = document.createElement('div');
    card.className = 'attr-card';
    card.innerHTML = `
      <div class="attr-card-name">
        <span>${CLASS_LABEL[cls].toUpperCase()}</span>
        <span class="totals">${a.hp*3} TP · Σ ${total}</span>
      </div>
      ${ATTR_DEFS.map(d => `
        <div class="attr-row">
          <span class="lbl">${d.label}</span>
          <span class="attr-dots">
            ${[1,2,3,4].map(n => `<span class="attr-dot${n <= a[d.key] ? ' on' : ''}"></span>`).join('')}
          </span>
        </div>
      `).join('')}
    `;
    attrs.appendChild(card);
  });

  document.getElementById('btn-ready').addEventListener('click', onToggleReady);
}

function onPickColor(hex){
  const my   = ME.isHost ? G.host  : G.guest;
  const them = ME.isHost ? G.guest : G.host;
  if (my.ready) return;
  if (them.color === hex) return; // opponent already has it

  if (ME.isHost){
    G.host.color = hex;
    broadcast();
  } else {
    G.guest.color = hex;
    sendToHost({ t:'COLOR', color:hex });
    refreshSelectionUI();
  }
}

function onPickVariant(cls, variant){
  const my = ME.isHost ? G.host : G.guest;
  if (my.ready) return;

  const current = my.selections[cls];
  // Clicking the already-selected variant deselects (toggles off).
  // Otherwise we either replace (class already in selection) or add.
  const isToggleOff = (current === variant);
  const isReplace   = (current !== undefined && current !== variant);
  const isAdd       = (current === undefined);

  if (isAdd){
    // Enforce the 8-class cap.
    const total = Object.keys(my.selections).length;
    if (total >= PICKS_REQUIRED) return;
  }

  // Compute new value: null means delete the class entry.
  const newVariant = isToggleOff ? null : variant;

  if (ME.isHost){
    if (newVariant === null) delete G.host.selections[cls];
    else                     G.host.selections[cls] = newVariant;
    broadcast();
  } else {
    if (newVariant === null) delete G.guest.selections[cls];
    else                     G.guest.selections[cls] = newVariant;
    sendToHost({ t:'SELECT', cls, variant: newVariant });
    refreshSelectionUI();
  }
}

function onToggleReady(){
  const my = ME.isHost ? G.host : G.guest;
  const sels = Object.keys(my.selections).length;
  if (sels < PICKS_REQUIRED || !my.color) return;
  const newReady = !my.ready;

  if (ME.isHost){
    G.host.ready = newReady;
    tryStartGame();
    broadcast();
  } else {
    G.guest.ready = newReady;
    sendToHost({ t:'READY', ready:newReady });
    refreshSelectionUI();
  }
}

function refreshSelectionUI(){
  const my   = ME.isHost ? G.host  : G.guest;
  const them = ME.isHost ? G.guest : G.host;

  // Color swatches
  document.querySelectorAll('.swatch').forEach(btn => {
    const hex = btn.dataset.color;
    const mine = (my.color === hex);
    const taken = (them.color === hex);
    btn.classList.toggle('selected', mine);
    btn.classList.toggle('taken',   taken && !mine);
    btn.disabled = my.ready || (taken && !mine);
  });

  // Highlight selected variants
  const myCount = Object.keys(my.selections).length;
  const atCap   = myCount >= PICKS_REQUIRED;
  document.querySelectorAll('.variant').forEach(tile => {
    const cls = tile.dataset.class;
    const v   = parseInt(tile.dataset.variant);
    const isMine    = my.selections[cls] === v;
    const classMine = my.selections[cls] !== undefined;
    // Dim variants of classes I haven't picked when I'm already at the cap.
    const cantAdd   = atCap && !classMine && !my.ready;
    tile.classList.toggle('selected', !!isMine);
    tile.style.pointerEvents = my.ready ? 'none' : '';
    tile.style.opacity = my.ready ? '.78' : (cantAdd ? '.4' : '');
    const p = previews[tile.dataset.unit];
    if (p) p.rotateSpeed = isMine ? 1.1 : 0.5;
  });

  const themCount = Object.keys(them.selections).length;
  const meCount = document.getElementById('me-count');
  const meState = document.getElementById('me-state');
  const themCountEl = document.getElementById('them-count');
  const themState   = document.getElementById('them-state');
  const btnReady    = document.getElementById('btn-ready');

  meCount.textContent = myCount + '/' + PICKS_REQUIRED;
  meCount.classList.toggle('full', myCount === PICKS_REQUIRED);
  themCountEl.textContent = themCount + '/' + PICKS_REQUIRED;
  themCountEl.classList.toggle('full', themCount === PICKS_REQUIRED);

  const myReadyOk   = myCount === PICKS_REQUIRED && !!my.color;
  const themReadyOk = themCount === PICKS_REQUIRED && !!them.color;

  meState.textContent = my.ready ? 'bereit'
                       : (!my.color ? 'wähle eine Farbe'
                       : myReadyOk ? 'wähle „Bereit“' : 'noch nicht bereit');
  meState.classList.toggle('ready', my.ready);

  const opponentJoined = ME.isHost ? G.guest.joined : true;
  themState.textContent = !opponentJoined ? 'wartet auf Beitritt…'
                         : them.ready    ? 'bereit'
                         : (themReadyOk  ? 'überlegt…' : 'wählt…');
  themState.classList.toggle('ready', them.ready && opponentJoined);

  btnReady.disabled = !myReadyOk;
  btnReady.textContent = my.ready ? 'Doch nicht' : 'Bereit';
  btnReady.classList.toggle('primary', !my.ready);
  btnReady.classList.toggle('danger', my.ready);
}

/* ──────────────────────────────────────────────────────────────
   TILE HIGHLIGHTS (reachable tiles)
   ────────────────────────────────────────────────────────────── */
const highlightMeshes = [];

function clearHighlights(){
  while (highlightMeshes.length){
    const m = highlightMeshes.pop();
    gameScene.remove(m);
    m.geometry.dispose();
    m.material.dispose();
  }
}

function showReachableHighlights(){
  clearHighlights();
  if (!gameScene) return;
  if (G.state !== 'PLAYING' || !G.turn || !G.turn.selectedKey) return;
  if (G.turn.side !== ME.side) return;
  const u = G.units[G.turn.selectedKey];
  if (!u || !u.alive) return;
  const range = G.turn.remainingMove;
  if (range <= 0){
    // No movement left but we still want attack highlights
    showAttackHighlights();
    return;
  }
  const reachable = computeReachable(u.col, u.row, range, u.key);
  reachable.forEach(({col, row}) => {
    const geo = new THREE.PlaneGeometry(TILE * 0.92, TILE * 0.92);
    const mat = new THREE.MeshBasicMaterial({
      color: 0xd8a838, transparent:true, opacity:0.38, depthWrite:false
    });
    const m = new THREE.Mesh(geo, mat);
    m.rotation.x = -Math.PI/2;
    m.position.set(col * TILE, 0.02, row * TILE);
    gameScene.add(m);
    highlightMeshes.push(m);
  });
  // Attack rings sit on top of any reachable tiles
  showAttackHighlights();
}

/* Red rings under enemies in attack range of the selected unit. */
function showAttackHighlights(){
  if (!gameScene) return;
  if (G.state !== 'PLAYING' || !G.turn || !G.turn.selectedKey) return;
  if (G.turn.side !== ME.side) return;
  if (G.turn.attacked[ME.side]) return; // already attacked this turn
  const attacker = G.units[G.turn.selectedKey];
  if (!attacker || !attacker.alive) return;

  const targets = getAttackTargets(attacker.key);
  // Pick whichever target is "active" — explicit one wins over the local fallback.
  const effectiveTarget = G.turn.attackTarget || _localAutoTarget;
  targets.forEach(t => {
    const isSelected = (effectiveTarget === t.key);
    // outer thick ring
    const ringGeo = new THREE.RingGeometry(0.78, 0.96, 48);
    const ringMat = new THREE.MeshBasicMaterial({
      color: isSelected ? 0xff5030 : 0xc83020,
      transparent:true,
      opacity: isSelected ? 0.95 : 0.65,
      depthWrite:false,
      side: THREE.DoubleSide,
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = -Math.PI/2;
    ring.position.set(t.col * TILE, 0.028, t.row * TILE);
    ring.userData.isAttackRing = true;
    ring.userData.unitKey = t.key;
    gameScene.add(ring);
    highlightMeshes.push(ring);

    // inner subtle fill when selected
    if (isSelected){
      const fillGeo = new THREE.CircleGeometry(0.75, 32);
      const fillMat = new THREE.MeshBasicMaterial({
        color: 0xff5030, transparent:true, opacity:0.18, depthWrite:false,
      });
      const fill = new THREE.Mesh(fillGeo, fillMat);
      fill.rotation.x = -Math.PI/2;
      fill.position.set(t.col * TILE, 0.022, t.row * TILE);
      gameScene.add(fill);
      highlightMeshes.push(fill);
    }
  });
}

/* ──────────────────────────────────────────────────────────────
   ATTACK INTERACTIONS — target picker, perform, animation
   ────────────────────────────────────────────────────────────── */
const _raycaster = new THREE.Raycaster();
const _mouseNDC  = new THREE.Vector2();

// Track pointer-down so we can distinguish a tap from a drag (OrbitControls
// swallows the synthetic 'click' on its own canvas, so we roll our own).
let _ptrDown = null;

function onCanvasPointerDown(ev){
  if (ev.button !== undefined && ev.button !== 0) return; // left button / primary touch only
  _ptrDown = { x: ev.clientX, y: ev.clientY, t: Date.now() };
}

function onCanvasPointerUp(ev){
  if (!_ptrDown) return;
  const dx = ev.clientX - _ptrDown.x;
  const dy = ev.clientY - _ptrDown.y;
  const dt = Date.now() - _ptrDown.t;
  _ptrDown = null;
  if (Math.abs(dx) > 6 || Math.abs(dy) > 6) return;  // dragged — treat as orbit gesture
  if (dt > 600) return;                              // long press — ignore
  onCanvasClickForAttack(ev);
}

/* Convert a screen pixel pos into normalised device coords inside the canvas */
function onCanvasClickForAttack(ev){
  if (G.state !== 'PLAYING' || !G.turn) return;
  if (G.turn.side !== ME.side) return;
  if (!G.turn.selectedKey) return;
  if (G.turn.attacked[ME.side]) return;
  if (G.turn.attackResult) return; // animation in flight

  const attacker = G.units[G.turn.selectedKey];
  if (!attacker || !attacker.alive) return;

  const canvas = renderer && renderer.domElement;
  if (!canvas || !gameCamera) return;

  const rect = canvas.getBoundingClientRect();
  const x = ev.clientX - rect.left;
  const y = ev.clientY - rect.top;
  _mouseNDC.x = (x / rect.width)  * 2 - 1;
  _mouseNDC.y = -(y / rect.height) * 2 + 1;

  _raycaster.setFromCamera(_mouseNDC, gameCamera);

  // Build hit list: enemy unit groups (raycast recursively into their meshes)
  const candidateGroups = Object.values(GAME.units).filter(g => {
    const k = g.userData && g.userData.unitKey;
    if (!k) return false;
    const u = G.units[k];
    return u && u.side !== ME.side && u.alive;
  });

  const hits = _raycaster.intersectObjects(candidateGroups, true);
  if (!hits.length) return;

  // Walk up to find the unit-group with userData.unitKey
  let obj = hits[0].object;
  while (obj && !(obj.userData && obj.userData.unitKey)) obj = obj.parent;
  if (!obj) return;
  const key = obj.userData.unitKey;

  const target = G.units[key];
  if (!target) return;
  if (!isInAttackRange(attacker, target)) return;

  setAttackTarget(key);
}

function setAttackTarget(key){
  // clicking the same target again deselects it
  const newKey = (G.turn.attackTarget === key) ? null : key;
  if (ME.isHost){
    G.turn.attackTarget = newKey;
    broadcast();
  } else {
    G.turn.attackTarget = newKey;
    sendToHost({ t:'SET_TARGET', key: newKey });
    refreshTurnUI();
  }
}

function onAttackClick(){
  if (!G.turn || G.turn.side !== ME.side) return;
  if (!G.turn.selectedKey) return;
  if (G.turn.attacked[ME.side]) return;
  if (G.turn.attackResult) return;

  // Fall back to whichever target is auto-highlighted locally if the player
  // hasn't explicitly clicked a figure yet.
  let targetKey = G.turn.attackTarget || _localAutoTarget;
  if (!targetKey){
    const targets = getAttackTargets(G.turn.selectedKey);
    if (targets.length === 0) return;
    targetKey = targets[0].key;
  }

  if (ME.isHost){
    performAttack(G.turn.selectedKey, targetKey);
  } else {
    sendToHost({ t:'ATTACK', attackerKey: G.turn.selectedKey, targetKey });
  }
}

/* Host-authoritative attack execution. */
function performAttack(attackerKey, targetKey){
  if (!ME.isHost) return;
  if (G.turn.attacked[G.turn.side]) return;
  if (G.turn.attackResult) return;

  const attacker = G.units[attackerKey];
  const target   = G.units[targetKey];
  if (!attacker || !target || !attacker.alive || !target.alive) return;
  if (!isInAttackRange(attacker, target)) return;

  const cards  = draw3();
  const result = resolveAttackCards(cards, attacker.dmg);

  // Apply damage IMMEDIATELY in authoritative state — animation just visualises.
  if (result.damage > 0){
    target.hp = Math.max(0, target.hp - result.damage);
    if (target.hp === 0) target.alive = false;
  }
  if (result.selfDamage > 0){
    attacker.hp = Math.max(0, attacker.hp - result.selfDamage);
    if (attacker.hp === 0) attacker.alive = false;
  }

  // Mark this side as having attacked
  G.turn.attacked[G.turn.side] = true;

  // Store the result so both clients can animate
  G.turn.attackResult = {
    attackerKey, targetKey,
    cards,
    outcome:    result.outcome,
    damage:     result.damage,
    selfDamage: result.selfDamage,
    id:         Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,6),
  };
  const animId = G.turn.attackResult.id;
  broadcast();

  // After the animation has run, clear attackResult so the overlay closes.
  setTimeout(() => {
    if (G.turn && G.turn.attackResult && G.turn.attackResult.id === animId){
      G.turn.attackResult = null;
      G.turn.attackTarget = null;
      broadcast();
    }
  }, 4400);
}

/* ──────────────────────────────────────────────────────────────
   CARD ANIMATION PLAYBACK
   ────────────────────────────────────────────────────────────── */
let _lastAnimId = null;

// When the player has a unit selected but hasn't explicitly clicked an enemy
// yet, we still pre-highlight the first valid target so the attack button
// works straight away. Local-only — never broadcast.
let _localAutoTarget = null;

function maybePlayAttackAnimation(){
  if (!G.turn || !G.turn.attackResult) return;
  if (G.turn.attackResult.id === _lastAnimId) return;
  _lastAnimId = G.turn.attackResult.id;
  playAttackAnimation(G.turn.attackResult);
}

function playAttackAnimation(res){
  const overlay = document.getElementById('card-overlay');
  const stage   = document.getElementById('card-stage');
  const resEl   = document.getElementById('card-result');
  if (!overlay || !stage || !resEl) return;

  // Build cards face-down
  stage.innerHTML = '';
  res.cards.forEach((cardId) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-back"></div>
      <div class="card-face"><img src="${BASE}${cardId}.png" alt="${cardId}" draggable="false"></div>
    `;
    stage.appendChild(card);
  });
  resEl.textContent = '';
  resEl.className = 'card-result';

  overlay.classList.add('show');

  // Staggered reveal
  const flipDelay = 360;
  const startDelay = 350;
  Array.from(stage.children).forEach((card, i) => {
    setTimeout(() => card.classList.add('flipped'), startDelay + i * flipDelay);
  });

  // Result label after the last flip
  const labelMap = {
    normal:   { head: 'Treffer',                detail: '−' + res.damage + ' Schaden' },
    crit:     { head: 'Kritischer Treffer!',    detail: '−' + res.damage + ' Schaden' },
    fail:     { head: 'Angriff erfolglos',      detail: 'Kein Schaden' },
    critfail: { head: 'Kritischer Fehlschlag!', detail: 'Angreifer −' + res.selfDamage + ' Schaden' },
  };
  const labelDelay = startDelay + 3 * flipDelay + 250;
  setTimeout(() => {
    const lbl = labelMap[res.outcome] || labelMap.normal;
    resEl.innerHTML = '<div class="res-headline">'+ lbl.head +'</div>'
                    + '<div class="res-detail">'+ lbl.detail +'</div>';
    resEl.className = 'card-result show ' + res.outcome;
  }, labelDelay);

  // Hold + fade out
  const holdTime = 2600;
  setTimeout(() => {
    overlay.classList.remove('show');
  }, labelDelay + holdTime);
}

/* ──────────────────────────────────────────────────────────────
   TURN UI — unit bar, arrow pad, turn banner
   ────────────────────────────────────────────────────────────── */
let unitBarBuilt = false;
let turnUIWired  = false;

function buildUnitBar(){
  if (unitBarBuilt) return;
  const bar = document.getElementById('unit-bar');
  if (!bar){ console.warn('[unit-bar] DOM element missing'); return; }
  if (!G.units){ console.warn('[unit-bar] G.units missing — abort build'); return; }
  unitBarBuilt = true;
  bar.innerHTML = '';

  // Sort by board position from the player's perspective: host looks at the
  // board from -z, so his "left-to-right" visually corresponds to descending
  // column indices; guest looks from +z, so ascending column indices match.
  const sortFn = (ME.side === 'host')
    ? (a, b) => b.idx - a.idx
    : (a, b) => a.idx - b.idx;
  const myUnits = Object.values(G.units).filter(u => u.side === ME.side).sort(sortFn);
  const myColor = (G[ME.side] && G[ME.side].color) || '#888888';
  console.log('[unit-bar] building', myUnits.length, 'cards for side='+ME.side);

  myUnits.forEach(u => {
    const cls   = u.cls || classOf(u.unitId);
    const label = (CLASS_LABEL[cls] || cls).toUpperCase();
    const spec  = SPECIES_LABEL[UNIT_SPECIES[u.unitId]] || '';
    const card = document.createElement('div');
    card.className = 'unit-card';
    card.dataset.key = u.key;
    card.innerHTML = `
      <span class="uc-marker" style="background:${myColor}"></span>
      <span class="uc-hp">${u.hp}/${u.hpMax}</span>
      <div class="uc-cls">${label}</div>
      <div class="uc-spec">${spec}</div>
    `;
    card.addEventListener('click', () => onUnitCardClick(u.key));
    bar.appendChild(card);
  });
}

function wireTurnUI(){
  if (turnUIWired) return;
  turnUIWired = true;
  document.querySelectorAll('.arrow-pad .arrow').forEach(btn => {
    btn.addEventListener('click', () => onArrowClick(btn.dataset.dir));
  });
  document.getElementById('btn-end-turn').addEventListener('click', onEndTurnClick);
  document.getElementById('btn-attack').addEventListener('click', onAttackClick);
  // Canvas tap → raycaster picks an enemy figure as attack target.
  // We use pointerdown + pointerup with drag-detection in CAPTURE phase,
  // because OrbitControls (in bubble phase) consumes the synthetic 'click'.
  if (renderer && renderer.domElement){
    renderer.domElement.addEventListener('pointerdown', onCanvasPointerDown, true);
    renderer.domElement.addEventListener('pointerup',   onCanvasPointerUp,   true);
  }
  window.addEventListener('keydown', e => {
    if (currentScreen() !== 'game') return;
    if (!G.turn || G.turn.side !== ME.side) return;
    const map = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
                  w:'up', s:'down', a:'left', d:'right',
                  W:'up', S:'down', A:'left', D:'right' };
    const dir = map[e.key];
    if (dir && G.turn.selectedKey){ e.preventDefault(); onArrowClick(dir); }
    else if (e.key === 'Enter'){ e.preventDefault(); onEndTurnClick(); }
    else if (e.key === ' ' || e.key === 'Spacebar'){
      // Space to launch the attack when a target is set
      if (G.turn.selectedKey && G.turn.attackTarget && !G.turn.attacked[ME.side]){
        e.preventDefault();
        onAttackClick();
      }
    }
  });
}

function refreshTurnUI(){
  if (!G.turn) { console.warn('[turn] refreshTurnUI: no G.turn yet'); return; }
  if (!G.units){ console.warn('[turn] refreshTurnUI: no G.units yet'); return; }
  const my = (G.turn.side === ME.side);

  // Turn banner
  const banner = document.getElementById('hud-turn');
  if (banner){
    banner.textContent = my ? `DEIN ZUG · ${G.turn.number}` : `GEGNER · ZUG ${G.turn.number}`;
    banner.classList.toggle('mine', my);
    banner.classList.toggle('theirs', !my);
  }

  // Unit bar — always visible during game; just disable cards when not my turn
  const bar = document.getElementById('unit-bar');
  if (bar){
    bar.classList.remove('hidden');
    const lastMoved = G.turn.lastMoved[ME.side];
    const sel = G.turn.selectedKey ? G.units[G.turn.selectedKey] : null;
    const committed = !!(sel && (G.turn.remainingMove < sel.mov || G.turn.attacked[ME.side]));
    Array.from(bar.children).forEach(card => {
      const key = card.dataset.key;
      const u = G.units[key];
      if (!u) return;
      const hp = card.querySelector('.uc-hp'); if (hp) hp.textContent = u.hp + '/' + u.hpMax;
      const isMySel = (key === G.turn.selectedKey);
      card.classList.toggle('dead',     !u.alive);
      card.classList.toggle('locked',   u.alive && key === lastMoved);
      // disabled only when not my turn, OR I have already committed to another figure
      card.classList.toggle('disabled', !my || (committed && !isMySel));
      card.classList.toggle('selected', isMySel && my);
    });
  }

  // Arrow pad
  const pad = document.getElementById('arrow-pad');
  if (pad){
    const canShowArrows = my && !!G.turn.selectedKey;
    pad.classList.toggle('hidden', !canShowArrows);
    if (canShowArrows){
      document.getElementById('pad-center').textContent = String(G.turn.remainingMove);
      const u = G.units[G.turn.selectedKey];
      ['up','down','left','right'].forEach(dir => {
        const btn = document.querySelector(`.arrow-pad .arrow[data-dir="${dir}"]`);
        if (!btn || !u) return;
        const [dc, dr] = getMoveDelta(dir, u.side);
        const nc = u.col + dc, nr = u.row + dr;
        const ok = (G.turn.remainingMove > 0)
                && nc >= 0 && nc < BOARD
                && nr >= 0 && nr < BOARD
                && !isOccupied(nc, nr, u.key);
        btn.disabled = !ok;
      });
    }
  }

  // End-turn button
  const endBtn = document.getElementById('btn-end-turn');
  if (endBtn) endBtn.disabled = !(my && !!G.turn.selectedKey) || !!G.turn.attackResult;

  // Attack button — enabled when it's my turn, my figure is selected, at least
  // one enemy is in range, I haven't yet attacked this turn, and no animation
  // is running. Explicit target click is OPTIONAL (auto-targets the first one).
  const atkBtn = document.getElementById('btn-attack');
  if (atkBtn){
    const targetsInRange = (my && G.turn.selectedKey && !G.turn.attacked[ME.side])
                         ? getAttackTargets(G.turn.selectedKey)
                         : [];
    // Refresh local auto-target so the visual ring follows along
    if (my && G.turn.selectedKey && !G.turn.attacked[ME.side] && !G.turn.attackResult
        && !G.turn.attackTarget && targetsInRange.length > 0){
      _localAutoTarget = targetsInRange[0].key;
    } else {
      _localAutoTarget = null;
    }
    const canAttack = my
                   && !!G.turn.selectedKey
                   && !G.turn.attacked[ME.side]
                   && !G.turn.attackResult
                   && targetsInRange.length > 0;
    atkBtn.disabled = !canAttack;
    atkBtn.style.display = (my && G.turn.selectedKey && targetsInRange.length > 0) ? '' : 'none';
  }

  showReachableHighlights();

  // Trigger card animation if a new attack result has appeared in state
  maybePlayAttackAnimation();
}

/* ──────────────────────────────────────────────────────────────
   TURN INPUT HANDLERS
   ────────────────────────────────────────────────────────────── */
function onUnitCardClick(key){
  if (!G.turn || G.turn.side !== ME.side) return;
  if (G.turn.attackResult) return;        // wait for animation to finish
  const u = G.units[key];
  if (!u || u.side !== ME.side || !u.alive) return;
  if (G.turn.lastMoved[ME.side] === key) return; // figure used last turn — locked

  // Re-selecting is allowed only during the preview phase: before any move
  // has been taken AND before any attack has been performed.
  if (G.turn.selectedKey){
    if (G.turn.selectedKey === key) return; // already on this one, no-op
    const sel = G.units[G.turn.selectedKey];
    const committed = sel && (G.turn.remainingMove < sel.mov || G.turn.attacked[ME.side]);
    if (committed) return;
  }

  if (ME.isHost){
    G.turn.selectedKey   = key;
    G.turn.remainingMove = u.mov;
    G.turn.attackTarget  = null;          // reset target when switching figures
    broadcast();
  } else {
    sendToHost({ t:'SELECT_UNIT', key });
  }
}

function onArrowClick(dir){
  if (!G.turn || G.turn.side !== ME.side) return;
  if (!G.turn.selectedKey) return;
  const u = G.units[G.turn.selectedKey];
  if (!u) return;
  const [dc, dr] = getMoveDelta(dir, u.side);
  const nc = u.col + dc, nr = u.row + dr;

  if (ME.isHost){
    if (applyMove(u.key, nc, nr)) broadcast();
  } else {
    sendToHost({ t:'MOVE', key:u.key, dir });
  }
}

function onEndTurnClick(){
  if (!G.turn || G.turn.side !== ME.side) return;
  if (!G.turn.selectedKey) return;

  if (ME.isHost){
    endTurnState();
    broadcast();
  } else {
    sendToHost({ t:'END_TURN' });
  }
}

/* ──────────────────────────────────────────────────────────────
   GAME ENTRY
   ────────────────────────────────────────────────────────────── */
let gameEntered = false;
function enterGame(){
  if (gameEntered) return;
  gameEntered = true;

  console.log('[game] enterGame · side='+ME.side+' · G.state='+G.state);
  console.log('[game] G.units present:', !!G.units, '· keys:', G.units ? Object.keys(G.units).length : 0);
  console.log('[game] G.turn present:', !!G.turn, G.turn);

  document.getElementById('hud-room').textContent = ME.room;
  document.getElementById('hud-me').textContent   = ME.side === 'host' ? 'DU · OBEN' : 'DU · UNTEN';
  document.getElementById('hud-them').textContent = ME.side === 'host' ? 'GEGNER · UNTEN' : 'GEGNER · OBEN';

  try {
    setupGameScene();
    buildBoard(G.seed);
    placeAllUnits();
    buildUnitBar();
    wireTurnUI();
    refreshTurnUI();
    console.log('[game] enterGame complete · unit cards:', document.getElementById('unit-bar').children.length);
  } catch (e){
    console.error('[game] enterGame failed:', e);
  }
}

/* ──────────────────────────────────────────────────────────────
   LOBBY EVENTS
   ────────────────────────────────────────────────────────────── */
function init(){
  setupRenderer();
  requestAnimationFrame(loop);

  const code = document.getElementById('room-code');
  // Auto-uppercase + strip spaces
  code.addEventListener('input', () => {
    code.value = code.value.toUpperCase().replace(/\s+/g,'');
  });
  // Suggest a random code
  code.value = 'MOSS-' + Math.floor(Math.random()*900 + 100);

  document.getElementById('btn-host').addEventListener('click', () => {
    const c = code.value.trim();
    if (c.length < 4){ setStatus('Code muss mindestens 4 Zeichen haben.','err'); return; }
    document.getElementById('btn-host').disabled = true;
    document.getElementById('btn-join').disabled = true;
    startHost(c);
  });
  document.getElementById('btn-join').addEventListener('click', () => {
    const c = code.value.trim();
    if (c.length < 4){ setStatus('Code muss mindestens 4 Zeichen haben.','err'); return; }
    document.getElementById('btn-host').disabled = true;
    document.getElementById('btn-join').disabled = true;
    startJoin(c);
  });
}

document.addEventListener('DOMContentLoaded', init);
</script>
